name: Publish package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify package before publishing
        run: |
          moon version --all
          moon update
          moon fmt
          git diff --exit-code
          moon check --deny-warn --target all
          moon test --deny-warn --target all
          moon info
          git diff --exit-code

      - name: Publish to Mooncakes
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "Error: MOONCAKES_TOKEN secret is not set."
            exit 1
          fi
          credentials="$HOME/.moon/credentials.json"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$MOONCAKES_TOKEN" > "$credentials"
          moon publish
